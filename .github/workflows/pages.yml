# Деплой на GitHub Pages (HTTPS) — запасной вариант к Vercel.
# Работает только в форке abdigaliarslan/admit-hack: раз в 15 минут подтягивает main
# из Rauan228/admit-hack, прогоняет проверки и выкладывает сборку. В основном репозитории
# задания пропускаются (там Pages не включён).
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'abdigaliarslan/admit-hack'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Подтянуть main из основного репозитория
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main || true
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /admit-hack/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
